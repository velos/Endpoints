openapi: 3.1.0
info: {title: Operations, version: 1.0.0}
servers: [{url: 'https://example.com/api'}]
paths:
  /records/{recordId}/{token}/{mode}:
    parameters:
      - {name: x-count, in: header, schema: {type: string}}
      - {name: recordId, in: path, required: true, explode: true, schema: {type: integer, format: int64}}
      - {name: token, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: mode, in: path, required: true, schema: {$ref: '#/components/schemas/Mode'}}
      - {name: limit, in: query, schema: {type: integer, format: int32}}
      - {name: inherited, in: query, schema: {type: boolean}}
    get:
      operationId: lookup
      parameters:
        - {name: limit, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: tags, in: query, schema: {type: array, items: {type: string}}}
        - {name: modes, in: query, schema: {type: array, items: {$ref: '#/components/schemas/Mode'}}}
        - {name: token, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [active, archived]}}
        - {name: small, in: query, schema: {type: integer, format: int32}}
        - {name: counters, in: query, required: true, schema: {type: array, items: {type: integer, format: int64}}}
        - {name: dates, in: query, schema: {type: array, items: {type: string, format: date-time}}}
        - {name: X-Count, in: header, required: true, explode: true, schema: {type: integer, format: int64}}
        - {name: X-Small, in: header, required: true, schema: {type: integer, format: int32}}
        - {name: X-Score, in: header, required: true, schema: {type: number}}
        - {name: X-Active, in: header, required: true, schema: {type: boolean}}
        - {name: X-Index, in: header, required: true, schema: {type: integer}}
      responses:
        default:
          description: Unexpected error
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        2XX:
          description: Other success
          content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}
        '200':
          description: Found
          content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}
        '204': {description: No record}
        4XX:
          description: Other client error
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '400':
          description: Bad request
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '404':
          description: Not found
          content:
            application/json:
              schema: {type: object, required: [resource], properties: {resource: {type: string}}}
        5XX:
          description: Other server error
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '500':
          description: Server failed
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  /raw:
    get:
      operationId: download
      responses:
        '206':
          description: Binary chunk
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '200':
          description: JSON metadata wins over other media
          content:
            image/png: {schema: {type: string, format: binary}}
            application/vnd.record+json: {schema: {$ref: '#/components/schemas/Problem'}}
            application/json: {schema: {$ref: '#/components/schemas/Record'}}
        '204': {description: No content}
        default:
          description: Raw error
          content: {text/plain: {schema: {type: string}}}
        '400':
          description: JSON problem
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '404': {description: No error body}
  /inline:
    post:
      operationId: inlineResult
      responses:
        '201':
          description: Inline object
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties: {value: {type: integer}}
        '202': {description: Queued}
  /unknown:
    get:
      operationId: unknownStatus
      responses:
        '299': {description: Unassigned success}
        '200': {description: OK}
  /default-success:
    get:
      operationId: fallback
      responses:
        default:
          description: Fallback success
          content: {application/vnd.record+json: {schema: {$ref: '#/components/schemas/Record'}}}
  /optional-header:
    get:
      operationId: optionalHeaders
      parameters:
        - {name: X-Name, in: header, schema: {type: string}}
        - {name: X-Count, in: header, schema: {type: integer}}
        - {name: X-Score, in: header, schema: {type: number}}
        - {name: X-Active, in: header, schema: {type: boolean}}
        - {name: X-Small, in: header, schema: {type: integer, format: int32}}
        - {name: X-Large, in: header, schema: {type: integer, format: int64}}
      responses: {'204': {description: Empty}}
  /special/{name}:
    get:
      operationId: specialPath
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Empty}}
  /enum/{state}/{code}:
    get:
      operationId: enumPath
      parameters:
        - {name: state, in: path, required: true, schema: {type: string, enum: [open, closed]}}
        - {name: code, in: path, required: true, schema: {type: integer, enum: [-1, 0, 42]}}
        - {name: code, in: query, schema: {$ref: '#/components/schemas/Code'}}
        - {name: alias, in: query, schema: {$ref: '#/components/schemas/ModeAlias'}}
        - {name: modes, in: query, required: true, schema: {type: array, items: {type: string, enum: [on, off]}}}
      responses: {'204': {description: Empty}}
  /modes/{state}-{code}.json:
    get:
      operationId: embeddedEnum
      parameters:
        - {name: state, in: path, required: true, schema: {type: string, enum: [ready-now, later]}}
        - {name: code, in: path, required: true, schema: {$ref: '#/components/schemas/Code'}}
      responses: {'204': {description: Empty}}
  /empty-error:
    get:
      operationId: emptyError
      responses:
        '204': {description: Empty}
        '400': {description: Empty error}
  /scalar-date:
    get:
      operationId: scalarDate
      responses:
        '200':
          description: Date value
          content: {application/json: {schema: {type: string, format: date-time}}}
        '204': {description: No date}
  /strict-errors:
    get:
      operationId: strictErrors
      responses:
        '204': {description: Empty}
        '400':
          description: Bad request
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '404':
          description: Missing
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  /selection:
    get:
      operationId: selection
      responses:
        '204': {description: Empty}
        default:
          description: Raw default
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        4XX:
          description: JSON client error
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        '404': {description: No body}
        '405':
          description: JSON method error
          content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
        5XX:
          description: Raw server error
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
  /raw-error:
    get:
      operationId: rawError
      responses:
        '204': {description: Empty}
        '500':
          description: Raw error
          content: {text/plain: {schema: {type: string}}}
  /deprecated:
    get:
      operationId: oldMode
      deprecated: true
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [fast, slow]}}
      responses: {'204': {description: Empty}}
  /head:
    head:
      operationId: metadata
      responses:
        '200':
          description: Headers only
          content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}
components:
  schemas:
    Mode: {type: string, enum: [fast, slow]}
    ModeAlias: {$ref: '#/components/schemas/Mode'}
    Code: {type: integer, format: int32, enum: [-1, 0, 1]}
    Record:
      type: object
      required: [id, timestamp]
      properties:
        id: {type: integer, format: int64}
        timestamp: {type: string, format: date-time}
    Problem:
      type: object
      required: [message]
      properties: {message: {type: string}}

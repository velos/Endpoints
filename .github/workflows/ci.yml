name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v
      
      - name: Build runtime without generator trait
        run: swift build --disable-default-traits --product Endpoints

      - name: Build and test plugin example
        run: |
          swift build --package-path Examples/PetstoreClient --build-tests
          swift test --package-path Examples/PetstoreClient

      - name: Build and test runtime-only example
        run: |
          swift build --package-path Examples/RuntimeOnlyClient --build-tests
          swift test --package-path Examples/RuntimeOnlyClient

      - name: Runtime-only consumer does not fetch generator dependencies
        run: |
          test -z "$(find Examples/RuntimeOnlyClient/.build/checkouts -maxdepth 1 -type d \( -iname '*openapikit*' -o -iname '*yams*' \) -print)"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: .build/debug/*Tests*
          retention-days: 5

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v
      
      - name: Build runtime without generator trait
        run: swift build --disable-default-traits --product Endpoints

      - name: Build and test plugin example
        run: |
          swift build --package-path Examples/PetstoreClient --build-tests
          swift test --package-path Examples/PetstoreClient

      - name: Build and test runtime-only example
        run: |
          swift build --package-path Examples/RuntimeOnlyClient --build-tests
          swift test --package-path Examples/RuntimeOnlyClient

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: .build/debug/*Tests*
          retention-days: 5
